services:
  mongodb:
    image: mongo:7.0.28
    networks:
      - grants-framework
    ports:
      - '27019:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  grants-config-feature-controls:
    build:
      context: .
      target: development
    ports:
      - '3002:3001'
    links:
      - 'mongodb:mongodb'
    depends_on:
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
      CONFIG_BROKER_API_URL: http://grants-config-broker:3001/api/feature-control
    networks:
      - grants-framework
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
      - ./configurations:/home/node/configurations
      - ./.env:/home/node/.env

################################################################################

volumes:
  mongodb-data:

networks:
  grants-framework:
    external: true
    name: grants-framework
