name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'feature-controls/**'

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: feature-controls/**

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Test code and Create Test Coverage Reports
        run: |
          npm ci
          npm test

      - name: Validate feature controls
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          curl -s https://raw.githubusercontent.com/DEFRA/grants-config-broker/main/src/routes/api/feature-control/feature-control-schemas.js -o scripts/feature-control-schemas.temp.js
          node scripts/validate-feature-controls.js ${{ steps.changed-files.outputs.all_changed_files }}
          rm scripts/feature-control-schemas.temp.js

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 #8.3.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
