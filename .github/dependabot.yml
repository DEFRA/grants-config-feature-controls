version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Separate production and development dependency updates into their own PRs
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    # Pin eslint to its current major (neostandard controls the version);
    # still allow minor/patch and security updates through
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'
    versioning-strategy: increase
    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    # Group all GitHub Actions bumps into a single PR
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

  # Update Docker
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'
